<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rosette studio</title>
  <style>
    /* the interface's colors, by day and by night (the art keeps its white paper either way) */
    :root {
      --page: #ddd;
      --panel: #fff;
      --text: #222;
      --muted: #777;
      --faint: #bbb;
      --line: #999;
      --field: #fff;
      --hover: #eee;
      --shadow: #0003;
      --layout: #f4f4f1;
      color-scheme: light;
    }

    :root.night {
      --page: #15161a;
      --panel: #1f2026;
      --text: #e4e4e8;
      --muted: #9a9aa4;
      --faint: #55565e;
      --line: #4a4b53;
      --field: #2a2b32;
      --hover: #34353d;
      --shadow: #0008;
      --layout: #25262d;
      color-scheme: dark;
    }

    /* switching fades, except for the first look at the page (which just starts in whichever it is) */
    :root.fading,
    :root.fading * {
      transition: background-color 0.8s ease, color 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      background: var(--page);
      color: var(--text);
      font: 13px/1.4 ui-monospace, Menlo, monospace;
    }

    /* the art on the left, as big as fits */
    #art {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      container-type: size;
    }

    /* the paper, at its own proportions, as big as fits (--ratio is its width over its height, see svg.js) */
    #art svg {
      width: min(100cqw, 100cqh * var(--ratio)) !important;
      height: min(100cqh, 100cqw / var(--ratio)) !important;
      flex: none;
      box-shadow: 0 2px 12px var(--shadow);
    }

    /* the console on the right, as wide as it's been dragged (see studio.js) */
    #panel {
      position: relative;
      width: var(--panel-width, 360px);
      flex: none;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--faint);
    }

    /* the handle on the console's edge facing the art, dragged to resize it (double-click puts it back) */
    #resize {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: -4px;
      width: 8px;
      cursor: col-resize;
      touch-action: none;
    }

    #resize:hover,
    body.resizing #resize {
      background: var(--faint);
    }

    body[data-panel="left"] #resize {
      left: auto;
      right: -4px;
    }

    body[data-panel="top"] #resize,
    body[data-panel="bottom"] #resize {
      left: 0;
      right: 0;
      width: auto;
      height: 8px;
      cursor: row-resize;
    }

    body[data-panel="top"] #resize {
      top: auto;
      bottom: -4px;
    }

    body[data-panel="bottom"] #resize {
      top: -4px;
      bottom: auto;
    }

    /* while it's dragged, nothing gets selected and the cursor stays the handle's */
    body.resizing {
      user-select: none;
      cursor: col-resize;
    }

    body.resizing[data-panel="top"],
    body.resizing[data-panel="bottom"] {
      cursor: row-resize;
    }

    body.resizing #art {
      pointer-events: none;
    }

    #panel header {
      display: flex;
      align-items: end;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--faint);
    }

    #panel header label {
      flex: 1;
    }

    #panel header label.placement {
      flex: none;
    }

    #panel .scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
    }

    /* the console on the left instead, or above or below the art (data-panel on the body, see studio.js). above or
       below, it's a band across the window, with its columns side by side */
    body[data-panel="left"] {
      flex-direction: row-reverse;
    }

    body[data-panel="left"] #panel {
      border-left: none;
      border-right: 1px solid var(--faint);
    }

    body[data-panel="top"] {
      flex-direction: column-reverse;
    }

    body[data-panel="bottom"] {
      flex-direction: column;
    }

    body[data-panel="top"] #art,
    body[data-panel="bottom"] #art {
      min-height: 0;
    }

    body[data-panel="top"] #panel,
    body[data-panel="bottom"] #panel {
      width: auto;
      height: var(--panel-height, 42vh);
      border-left: none;
    }

    body[data-panel="top"] #panel {
      border-bottom: 1px solid var(--faint);
    }

    body[data-panel="bottom"] #panel {
      border-top: 1px solid var(--faint);
    }

    body[data-panel="top"] #controls,
    body[data-panel="bottom"] #controls {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: start;
      column-gap: 32px;
    }

    body[data-panel="top"] #controls .piece,
    body[data-panel="bottom"] #controls .piece {
      width: 220px;
      box-sizing: border-box;
    }

    body[data-panel="top"] #controls .section,
    body[data-panel="bottom"] #controls .section {
      padding: 0 32px 0 0;
      border-bottom: none;
      border-right: 1px solid var(--faint);
    }

    body[data-panel="top"] #controls .section.layout,
    body[data-panel="bottom"] #controls .section.layout {
      flex-flow: row wrap;
      align-items: start;
      margin: 0;
      padding: 16px;
      border-right: none;
      column-gap: 32px;
    }

    body[data-panel="top"] #controls .section.layout > h1,
    body[data-panel="bottom"] #controls .section.layout > h1 {
      width: 100%;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* every part of a section is a card of its own, headed by its name */
    #controls .piece {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      background: var(--panel);
      border: 1px solid var(--faint);
      border-radius: 6px;
    }

    /* a part with no name of its own (the paper's fields) needs no card around it */
    #controls .piece:not(:has(> h2)) {
      padding: 0;
      background: none;
      border: none;
    }

    /* its colors, set apart at the bottom of it */
    #controls .piece .colors {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px dashed var(--faint);
    }

    #controls .piece .colors > h3 {
      margin: 0;
      font: inherit;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* a pattern and an order of pens, side by side */
    #controls .coloring {
      display: flex;
      gap: 6px;
    }

    #controls .coloring select {
      flex: 1;
      min-width: 0;
    }

    #controls .coloring input[type="text"] {
      width: 5em;
      font-family: inherit;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* the rosette grid's colorings: a row each, with buttons to shuffle and delete it */
    #controls .colorings {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #controls .coloring input.weight {
      width: 3.5em;
    }

    #controls .coloring button.shuffle,
    #controls .coloring button.remove {
      padding: 2px 8px;
    }

    /* the history: back and forward, then every change, section by section, the ones gone back past dimmed */
    #controls .history .changes {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    #controls .history .section-changes {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #controls .history h3 {
      margin: 0 0 2px;
      font: inherit;
      font-size: 11px;
      color: var(--muted);
    }

    #controls .history .change {
      align-self: stretch;
      text-align: left;
      border: none;
      padding: 2px 6px;
      background: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #controls .history .change.current {
      outline: 1px solid var(--line);
    }

    #controls .history .change.undone {
      opacity: 0.4;
    }

    #controls .history .empty {
      color: var(--muted);
    }

    /* a line between runs of controls */
    #controls hr.divider {
      width: calc(100% + 24px);
      margin: 10px -12px;
      border: none;
      height: 3px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    /* a setting's two sliders, one above the other: a range (two knobs, the stretch between them filled in, the value
       picked for the drawing in gray beside it) and an exact value (one knob). the one in use is blue, the other gray */
    #controls .range {
      display: flex;
      flex-direction: column;
      gap: 1px;
      color: var(--muted);
    }

    #controls .range > span {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    #controls .range .picked {
      color: var(--muted);
      font-style: normal;
    }

    #controls .range .dual {
      position: relative;
      height: 16px;
      cursor: pointer;
    }

    #controls .range .dual::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 7px;
      height: 2px;
      background: var(--faint);
    }

    #controls .range .dual .fill {
      position: absolute;
      top: 6px;
      height: 4px;
      background: #a8a8a8;
    }

    #controls .range .dual.active .fill {
      background: #2f6fed;
    }

    #controls .range .dual input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 16px;
      margin: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
    }

    #controls .range .dual input[type="range"]::-webkit-slider-runnable-track {
      height: 16px;
      background: none;
    }

    #controls .range .dual input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      margin-top: 2px;
      border-radius: 50%;
      background: #a8a8a8;
      cursor: pointer;
      pointer-events: auto;
    }

    #controls .range .dual input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: #a8a8a8;
      cursor: pointer;
      pointer-events: auto;
    }

    #controls .range .dual.active input[type="range"]::-webkit-slider-thumb {
      background: #2f6fed;
    }

    #controls .range .dual.active input[type="range"]::-moz-range-thumb {
      background: #2f6fed;
    }

    /* a setting's reset: a small button at the right end of its row, putting it back to its default */
    #controls label > span,
    #controls .range > span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #controls label > span > b,
    #controls .range > span > b {
      margin-left: auto;
    }

    #controls label.toggle > span {
      flex: 1;
    }

    #controls button.reset {
      margin-left: auto;
      padding: 0 4px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      opacity: 0.5;
    }

    #controls b + button.reset {
      margin-left: 2px;
    }

    #controls button.reset:hover {
      opacity: 1;
      color: var(--text);
    }

    /* headings fold their section or card shut, and open again */
    #controls .section > h1,
    #controls .piece > h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    #controls .section > h1::after,
    #controls .piece > h2::after {
      content: '▾';
      color: var(--muted);
      font-weight: normal;
    }

    #controls .folded > h1::after,
    #controls .folded > h2::after {
      content: '▸';
    }

    #controls .section.folded > :not(h1),
    #controls .piece.folded > :not(h2) {
      display: none !important;
    }

    #controls .piece > h2 {
      margin: -10px -12px 2px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--faint);
      border-radius: 6px 6px 0 0;
      background: var(--hover);
    }

    #controls .piece.folded > h2 {
      margin-bottom: -12px;
      border-bottom: none;
      border-radius: 6px;
    }

    /* the console's sections (see sections.js): the drawing, the paper, and the pens, then the layout's own, set apart
       as the second part */
    #controls .section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--faint);
    }

    #controls .section > h1 {
      margin: 0;
      font: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #controls .section > button {
      align-self: start;
    }

    #controls .section.layout {
      margin: 0 -16px;
      padding: 16px;
      border-bottom: none;
      background: var(--layout);
    }

    #controls h2 {
      margin: 0;
      font: inherit;
      font-weight: bold;
    }

    #panel label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--muted);
    }

    /* a control's name, with its value (if it shows one) at the other end */
    #controls label > span {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    #controls label.toggle {
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    #controls [hidden] {
      display: none;
    }

    #controls b {
      color: var(--text);
      font-weight: normal;
    }

    #controls input[type="range"] {
      width: 100%;
      margin: 0;
    }

    #panel select,
    #panel button,
    #controls input[type="text"],
    #controls input[type="number"] {
      font: inherit;
      padding: 4px 6px;
      background: var(--field);
      color: var(--text);
      border: 1px solid var(--line);
    }

    #controls input[type="number"] {
      width: 6em;
    }

    #panel button {
      cursor: pointer;
    }

    #panel button:hover {
      background: var(--hover);
    }

    #controls > button {
      align-self: start;
    }

    #controls button:disabled {
      cursor: default;
      color: var(--faint);
      border-color: var(--faint);
    }

    /* save and delete, refresh and reset, side by side */
    #controls .buttons {
      display: flex;
      gap: 6px;
    }

    /* the rosette grid's palette: how many pens, then a pen to a row, with its handle, letter, color, and thickness */
    #controls .palette,
    #controls .pens {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #controls .stepper,
    #controls .pen {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    #controls .stepper b {
      min-width: 1.5ch;
      text-align: center;
    }

    #controls .stepper button {
      width: 2em;
      padding: 2px 0;
    }

    #controls .pen .handle {
      cursor: grab;
      user-select: none;
      padding: 0 2px;
    }

    #controls .pen.dragging {
      opacity: 0.4;
    }

    #controls .pen.over {
      outline: 1px dashed var(--muted);
      outline-offset: 2px;
    }

    /* the row for every pen's thickness at once, its box under theirs */
    #controls .pen.all {
      padding-top: 6px;
      border-top: 1px dashed var(--faint);
    }

    #controls .pen.all .handle {
      visibility: hidden;
    }

    #controls .pen.all .every {
      width: calc(9em - 1px);
      padding: 0 7px;
      box-sizing: border-box;
      font-style: italic;
    }

    /* a pen's color: its swatch and name, and a menu of all of them under it */
    #controls .picker {
      position: relative;
    }

    #controls .picker button {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 9em;
      text-align: left;
    }

    #controls .swatch {
      display: inline-block;
      flex: none;
      width: 1em;
      height: 1em;
      border: 1px solid #fff4;
      outline: 1px solid #0003;
    }

    #controls .picker .list {
      position: absolute;
      z-index: 1;
      top: 100%;
      left: 0;
      display: flex;
      flex-direction: column;
      background: var(--field);
      border: 1px solid var(--line);
      box-shadow: 0 2px 8px var(--shadow);
    }

    #controls .picker .list[hidden] {
      display: none;
    }

    #controls .picker .list button {
      border: none;
    }

    #controls .picker .list button.on {
      background: var(--hover);
    }

    #hash {
      margin-top: 16px;
      color: var(--muted);
      word-break: break-all;
    }

    /* narrow windows: the art above, the console under it */
    @media (max-width: 760px) {
      body {
        flex-direction: column;
        height: auto;
      }

      #art {
        height: 60vh;
        flex: none;
      }

      #panel {
        width: auto;
        border-left: none;
        border-top: 1px solid var(--faint);
      }
    }
  </style>
</head>
<body>
  <main id="art"></main>
  <aside id="panel">
    <div id="resize" title="drag to resize (double-click to reset)"></div>
    <header>
      <label>layout <select id="layout"></select></label>
      <label class="placement">console <select id="placement"></select></label>
      <button id="theme" type="button"></button>
    </header>
    <div class="scroll">
      <div id="controls"></div>
      <div id="hash"></div>
    </div>
  </aside>
  <script type="module" src="./studio.js"></script>
</body>
</html>
