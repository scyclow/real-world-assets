<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rosette swatch</title>
  <link rel="stylesheet" href="./pens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      background: #ddd;
      font: 13px/1.4 ui-monospace, Menlo, monospace;
      color: #222;
    }

    #swatch {
      height: 75vh;
      aspect-ratio: 60 / 100;
      display: flex;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 24px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid #bbb;
    }

    /* unused here: the controls are one row of fields */
    #controls .piece {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #controls h2 {
      margin: 0;
      font: inherit;
      font-weight: bold;
    }

    #controls label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #777;
    }

    #controls label.toggle {
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    #controls [hidden] {
      display: none;
    }

    #controls b {
      color: #222;
      font-weight: normal;
    }

    #controls input[type="range"] {
      width: 100%;
      margin: 0;
    }

    #controls select,
    #controls input[type="text"],
    #controls button {
      font: inherit;
      padding: 4px 6px;
      background: #fff;
      border: 1px solid #999;
    }

    #controls button {
      cursor: pointer;
      align-self: center;
    }

    /* the presets' save and delete, and refresh and reset, side by side */
    #controls .buttons {
      display: flex;
      gap: 6px;
    }

    #controls button:hover {
      background: #eee;
    }

    #hash {
      color: #777;
      word-break: break-all;
      max-width: 60ch;
    }
  </style>
</head>
<body>
  <div id="swatch"></div>
  <div id="controls"></div>
  <div id="hash"></div>
  <script type="module">
    import { mount } from './swatchConsole.js'

    mount({
      $art: document.getElementById('swatch'),
      $controls: document.getElementById('controls'),
      $hash: document.getElementById('hash'),
    })
  </script>
</body>
</html>
